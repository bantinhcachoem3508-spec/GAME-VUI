<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Motion Game - 60s Challenge</title>
    <!-- Thư viện Three.js cho đồ họa 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Thư viện MediaPipe Pose để nhận diện cử động qua Camera -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Arial', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Giao diện UI Tiếng Anh */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        #webcam-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 180px;
            height: 135px;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            transform: scaleX(-1); /* Lật gương camera */
            object-fit: cover;
        }
        #traffic-light-banner {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 55px;
            font-weight: 900;
            color: yellow;
            text-shadow: 3px 3px 6px #000;
            display: none;
            pointer-events: none;
            text-align: center;
        }
        #status-box {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }
        /* Màn hình kết quả khi hết 60 giây */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            display: none;
            z-index: 10;
        }
        #game-over-screen h1 {
            font-size: 60px;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 3px 3px 10px rgba(255,204,0,0.5);
        }
        #game-over-screen p {
            font-size: 28px;
            margin: 10px 0;
        }
        #restart-btn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background-color: #00ffcc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #111;
            box-shadow: 0 4px 10px rgba(0,255,204,0.4);
            transition: 0.2s;
        }
        #restart-btn:hover {
            background-color: #00cc99;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="ui">
        SCORE: <span id="score">0</span><br>
        TIME LEFT: <span id="timer">60</span>s<br>
        ACTION: <span id="action-text" style="color: #ffcc00;">WAITING FOR PLAYER...</span>
    </div>

    <div id="status-box">CAMERA: INITIALIZING...</div>
    <div id="traffic-light-banner">RED LIGHT! STOP!</div>
    
    <!-- Màn hình tổng kết khi kết thúc 60s -->
    <div id="game-over-screen">
        <h1>TIME'S UP! GREAT JOB!</h1>
        <p>Your Final Score: <span id="final-score" style="color: #00ffcc; font-weight: bold;">0</span></p>
        <button id="restart-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div id="canvas-container"></div>
    <video id="webcam-video" autoplay playsinline></video>

    <script>
        // --- 1. KHỞI TẠO GAME 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Màu trời xanh
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // Ánh sáng môi trường
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Tạo đường đua 3 làn
        const roadWidth = 9;
        const roadLength = 400;
        const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -roadLength / 2 + 50;
        road.receiveShadow = true;
        scene.add(road);

        // Vạch kẻ 3 làn đường
        for (let i = -roadWidth/6; i <= roadWidth/6; i += roadWidth/3) {
            if(i === 0) continue;
            const lineGeo = new THREE.PlaneGeometry(0.2, roadLength);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(i, 0.01, -roadLength / 2 + 50);
            scene.add(line);
        }

        // Tạo xe Kart (Đỏ rực rỡ phong cách Mario Kart)
        const kartGroup = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(1.2, 0.5, 2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000, roughness: 0.3 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.4;
        carBody.castShadow = true;
        kartGroup.add(carBody);

        const headGeo = new THREE.BoxGeometry(1, 0.4, 0.8);
        const headMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const carHead = new THREE.Mesh(headGeo, headMat);
        carHead.position.set(0, 0.7, -0.4);
        kartGroup.add(carHead);

        const wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        [-0.7, 0.7].forEach(x => {
            [-0.8, 0.8].forEach(z => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(x, 0.3, z);
                kartGroup.add(wheel);
            });
        });

        scene.add(kartGroup);
        kartGroup.position.set(0, 0, 2);

        // Tạo vật phẩm: Thử thách rẽ trái/phải, đồng xu thưởng, và lằn ranh giảm tốc (Slow-down Lines)
        const obstacles = [];
        for (let z = -15; z > -350; z -= 14) {
            const lane = (Math.floor(Math.random() * 3) - 1) * 3; // -3, 0, 3
            const typeRand = Math.random();
            
            let itemGeo, itemMat, typeStr;
            if (typeRand < 0.45) {
                // Đồng xu vàng (Phần thưởng)
                itemGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.2, 16);
                itemMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8 });
                typeStr = 'coin';
            } else if (typeRand < 0.75) {
                // Chướng ngại vật bắt buộc né (Rẽ trái/phải)
                itemGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
                itemMat = new THREE.MeshStandardMaterial({ color: 0xff3300 });
                typeStr = 'obstacle';
            } else {
                // Lằn ranh vạch ngang đường (Yêu cầu giơ 2 tay lên đi chậm)
                itemGeo = new THREE.BoxGeometry(roadWidth, 0.05, 1);
                itemMat = new THREE.MeshStandardMaterial({ color: 0x00ffff });
                typeStr = 'slow_zone';
            }
            
            const item = new THREE.Mesh(itemGeo, itemMat);
            // Nếu là lằn ranh, đặt ở giữa đường ngập 3 làn
            if (typeStr === 'slow_zone') {
                item.position.set(0, 0.02, z);
            } else {
                item.position.set(lane, 0.5, z);
            }
            
            item.userData = { type: typeStr, collected: false };
            scene.add(item);
            obstacles.push(item);
        }

        // --- 2. BIẾN TRẠNG THÁI GAME & ĐIỀU KHIỂN ---
        let currentLane = 0; // -1: Trái, 0: Giữa, 1: Phải
        let targetX = 0;
        let gameSpeed = 0.12; // Tốc độ bình thường vừa phải
        let score = 0;
        let currentActionState = "WAITING";
        let gameRunning = true;
        let timeLeft = 60;

        // Đếm ngược thời gian 60 giây
        const timerInterval = setInterval(() => {
            if (!gameRunning) return;
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) {
                gameRunning = false;
                clearInterval(timerInterval);
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').style.display = 'flex';
            }
        }, 1000);

        // Cơ chế Đèn giao thông xuất hiện ngẫu nhiên kiểm tra cử động dừng
        let isRedLight = false;
        const trafficLightInterval = setInterval(() => {
            if (!gameRunning) return;
            isRedLight = true;
            document.getElementById('traffic-light-banner').style.display = 'block';
            document.getElementById('traffic-light-banner').innerHTML = "RED LIGHT!<br><span style='font-size:35px; color:white;'>STOP (Hands at shoulders)</span>";
            document.getElementById('traffic-light-banner').style.color = "red";
            
            // Đèn đỏ kéo dài 1.5 giây
            setTimeout(() => {
                if (!gameRunning) return;
                isRedLight = false;
                document.getElementById('traffic-light-banner').innerHTML = "GREEN LIGHT!<br><span style='font-size:35px; color:white;'>GO!</span>";
                document.getElementById('traffic-light-banner').style.color = "green";
                setTimeout(() => {
                    document.getElementById('traffic-light-banner').style.display = 'none';
                }, 1000);
            }, 1500);
        }, 14000);


        // --- 3. NHẬN DIỆN CỬ CHỈ BẰNG MEDIAPIPE POSE ---
        const videoElement = document.getElementById('webcam-video');
        const actionTextEl = document.getElementById('action-text');
        const statusBox = document.getElementById('status-box');

        function onResults(results) {
            if (!gameRunning) return;
            if (!results.poseLandmarks) {
                statusBox.innerText = "CAMERA: NO PERSON FOUND";
                return;
            }

            statusBox.innerText = "CAMERA: ACTIVE (READY)";
            const landmarks = results.poseLandmarks;

            const leftWrist = landmarks[15];
            const rightWrist = landmarks[16];
            const leftShoulder = landmarks[11];
            const rightShoulder = landmarks[12];
            const nose = landmarks[0];

            // 1. Tay chạm nhau trên đầu -> START / ACCELERATE
            const distanceWrists = Math.hypot(leftWrist.x - rightWrist.x, leftWrist.y - rightWrist.y);
            const isHandsTogetherOnHead = (leftWrist.y < nose.y && rightWrist.y < nose.y && distanceWrists < 0.18);

            // 2. Giơ thẳng 2 tay lên đầu song song -> SLOW DOWN (Qua lằn ranh)
            const isHandsUpParallel = (leftWrist.y < leftShoulder.y && rightWrist.y < rightShoulder.y && Math.abs(leftWrist.x - leftShoulder.x) < 0.18);

            // 3. Tay để ngang vai -> STOP
            const isHandsAtShoulders = (Math.abs(leftWrist.y - leftShoulder.y) < 0.15 && Math.abs(rightWrist.y - rightShoulder.y) < 0.15);

            // 4. Nghiêng người sang trái / phải
            const shoulderMidX = (leftShoulder.x + rightShoulder.x) / 2;
            const tiltOffset = nose.x - shoulderMidX;

            // Xử lý logic gán hành động
            if (isHandsAtShoulders) {
                currentActionState = "STOP (Hands at shoulders)";
                gameSpeed = 0;
            } else if (isHandsUpParallel) {
                currentActionState = "SLOW DOWN (Hands up)";
                gameSpeed = 0.05; // Đi chậm
            } else if (isHandsTogetherOnHead) {
                currentActionState = "DRIVING (Normal Speed)";
                gameSpeed = 0.13; // Tốc độ bình thường
                
                // Nghiêng người đổi làn
                if (tiltOffset > 0.07) {
                    currentLane = -1; // Làn trái (Do gương camera)
                    currentActionState += " -> LANE LEFT";
                } else if (tiltOffset < -0.07) {
                    currentLane = 1; // Làn phải
                    currentActionState += " -> LANE RIGHT";
                } else {
                    currentLane = 0; // Làn giữa
                }
            } else {
                currentActionState = "IDLE (Show gestures)";
                gameSpeed = 0;
            }

            // Kiểm tra luật chơi Đèn Đỏ (Phải dừng hẳn - Hands at shoulders)
            if (isRedLight) {
                if (gameSpeed > 0.02) {
                    score -= 3; // Trừ điểm nếu không chịu dừng lúc đèn đỏ
                } else {
                    score += 1; // Thưởng điểm đứng nghiêm đúng luật
                }
            }

            actionTextEl.innerText = currentActionState;
            targetX = currentLane * 3; // Mỗi làn cách nhau 3 đơn vị
        }

        const pose = new Pose({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
        });
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        pose.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await pose.send({ image: videoElement });
            },
            width: 320,
            height: 240
        });
        cameraUtils.start();

        // --- 4. Vòng lặp Render & Xử lý va chạm game ---
        function animate() {
            requestAnimationFrame(animate);
            if (!gameRunning) return;

            // Di chuyển xe mượt mà sang làn mục tiêu
            kartGroup.position.x += (targetX - kartGroup.position.x) * 0.1;

            // Cho đường chạy lại tạo cảm giác tiến về phía trước
            obstacles.forEach(item => {
                item.position.z += gameSpeed;
                
                // Xoay đồng hồ/vật phẩm
                if(item.userData.type === 'coin') {
                    item.rotation.y += 0.05;
                }

                // Kiểm tra va chạm với xe Kart
                const distance = kartGroup.position.distanceTo(item.position);
                if (distance < 1.3 && !item.userData.collected) {
                    if (item.userData.type === 'coin') {
                        item.userData.collected = true;
                        scene.remove(item);
                        score += 10; // Ăn xu thưởng
                    } else if (item.userData.type === 'obstacle') {
                        item.userData.collected = true;
                        scene.remove(item);
                        score -= 5;  // Trúng chướng ngại vật (phải né sang làn khác)
                    } else if (item.userData.type === 'slow_zone') {
                        // Đi qua lằn ranh: nếu học sinh đi chậm (giơ tay song song) sẽ được thưởng điểm
                        item.userData.collected = true;
                        if (gameSpeed <= 0.06) {
                            score += 15; // Thưởng lớn vì tuân thủ qua lằn ranh chậm
                        } else {
                            score -= 2;  // Phạt vì phóng nhanh qua lằn ranh
                        }
                    }
                }

                // Reset vật phẩm khi chạy qua màn hình
                if (item.position.z > 5) {
                    item.position.z = -350;
                    item.userData.collected = false;
                    scene.add(item);
                }
            });

            document.getElementById('score').innerText = score;
            renderer.render(scene, camera);
        }

        animate();

        // Tự động căn chỉnh khi đổi kích thước màn hình
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
