<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart Motion - Pro Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <!-- Thêm Font chữ Game -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Bangers', cursive; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Nâng cấp */
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #fff;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #ui-left { top: 20px; left: 20px; }
        #ui-right { top: 20px; right: 20px; text-align: right; }
        
        .hud-text { color: white; font-size: 28px; letter-spacing: 2px; margin: 5px 0; text-shadow: 2px 2px 0 #000; }
        .highlight { color: #ffcc00; font-size: 34px; }
        .score-val { color: #00ffcc; font-size: 36px; }

        #webcam-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            border: 5px solid #ffcc00;
            border-radius: 15px;
            transform: scaleX(-1);
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.5);
            object-fit: cover;
        }

        #traffic-light-banner {
            position: absolute;
            top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 70px;
            color: #ff3300;
            text-shadow: 4px 4px 0 #000, 0 0 30px #ff3300;
            display: none;
            text-align: center;
            animation: pulse 0.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.1); }
        }

        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        #game-over-screen h1 { font-size: 80px; color: #ffcc00; text-shadow: 4px 4px 0 #ff3300; margin: 0; }
        #restart-btn {
            margin-top: 30px; padding: 15px 40px; font-family: 'Bangers', cursive;
            font-size: 30px; background: #00ffcc; color: #000; border: 4px solid #fff;
            border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        #restart-btn:hover { background: #fff; color: #ff3300; transform: scale(1.1); }
    </style>
</head>
<body>

    <div id="ui-left" class="hud-panel">
        <div class="hud-text">SCORE: <span id="score" class="score-val">0</span></div>
        <div class="hud-text">TIME: <span id="timer" class="highlight">60</span>s</div>
    </div>

    <div id="ui-right" class="hud-panel">
        <div class="hud-text" style="color: #aaa; font-size: 18px;" id="status-box">CAMERA: STARTING...</div>
        <div class="hud-text">ACTION: <span id="action-text" class="highlight" style="color: #fff;">WAITING</span></div>
    </div>

    <div id="traffic-light-banner">RED LIGHT!<br><span style="font-size:40px; color:white;">STOP NOW!</span></div>
    
    <div id="game-over-screen">
        <h1>FINISH!</h1>
        <div class="hud-text" style="font-size: 40px; margin-top: 20px;">TOTAL SCORE: <span id="final-score" class="score-val">0</span></div>
        <button id="restart-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <div id="canvas-container"></div>
    <video id="webcam-video" autoplay playsinline></video>

    <script>
        // --- 1. ĐỒ HỌA 3D ĐƯỢC TINH CHỈNH ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4cb4f8); // Xanh Mario
        scene.fog = new THREE.Fog(0x4cb4f8, 30, 150);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 9);
        camera.lookAt(0, 0, -10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Bóng đổ mềm mượt hơn
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(20, 30, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Nền cỏ
        const grassGeo = new THREE.PlaneGeometry(200, 400);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x55aa33 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.position.z = -100;
        grass.receiveShadow = true;
        scene.add(grass);

        // Đường đua
        const roadGeo = new THREE.PlaneGeometry(12, 400);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -100;
        road.position.y = 0.05;
        road.receiveShadow = true;
        scene.add(road);

        // Vạch phân làn
        for (let i = -2; i <= 2; i += 4) {
            const lineGeo = new THREE.PlaneGeometry(0.2, 400);
            const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(i, 0.06, -100);
            scene.add(line);
        }

        // Xe Kart cải tiến
        const kartGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(1.4, 0.6, 2.2);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.5; carBody.castShadow = true;
        kartGroup.add(carBody);

        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 20);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        [-0.8, 0.8].forEach(x => { [-0.9, 0.9].forEach(z => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(x, 0.4, z);
            kartGroup.add(wheel);
        });});
        scene.add(kartGroup);
        kartGroup.position.set(0, 0, 2);

        const obstacles = [];
        for (let z = -20; z > -400; z -= 16) {
            const lane = (Math.floor(Math.random() * 3) - 1) * 4;
            const rand = Math.random();
            let mesh, type;
            
            if (rand < 0.4) {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffd700 }));
                mesh.rotation.x = Math.PI/2; type = 'coin'; mesh.position.set(lane, 1, z);
            } else if (rand < 0.75) {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xff3300 }));
                type = 'obstacle'; mesh.position.set(lane, 0.75, z); mesh.castShadow = true;
            } else {
                mesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 2), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
                mesh.rotation.x = -Math.PI/2; type = 'slow'; mesh.position.set(0, 0.07, z);
            }
            mesh.userData = { type: type, collected: false };
            scene.add(mesh); obstacles.push(mesh);
        }

        // --- 2. GAME LOGIC ---
        let currentLane = 0, targetX = 0, gameSpeed = 0.15, score = 0;
        let gameRunning = true, timeLeft = 60, isRedLight = false;

        const timerInt = setInterval(() => {
            if(!gameRunning) return;
            timeLeft--; document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) {
                gameRunning = false; clearInterval(timerInt);
                document.getElementById('final-score').innerText = score;
                document.getElementById('game-over-screen').style.display = 'flex';
            }
        }, 1000);

        setInterval(() => {
            if(!gameRunning) return;
            isRedLight = true;
            document.getElementById('traffic-light-banner').style.display = 'block';
            document.getElementById('traffic-light-banner').style.color = "#ff3300";
            document.getElementById('traffic-light-banner').innerHTML = "RED LIGHT!<br><span style='font-size:40px; color:white;'>STOP!</span>";
            setTimeout(() => {
                isRedLight = false;
                document.getElementById('traffic-light-banner').style.color = "#00ffcc";
                document.getElementById('traffic-light-banner').innerHTML = "GREEN LIGHT!<br><span style='font-size:40px; color:white;'>GO!</span>";
                setTimeout(() => document.getElementById('traffic-light-banner').style.display = 'none', 1000);
            }, 2000);
        }, 12000);

        // --- 3. AI TỶ LỆ (CHUẨN XÁC HƠN) ---
        const videoElement = document.getElementById('webcam-video');
        
        function onResults(results) {
            if(!gameRunning) return;
            if (!results.poseLandmarks) { document.getElementById('status-box').innerText = "NO PLAYER"; return; }
            document.getElementById('status-box').innerText = "TRACKING: OK";
            
            const lm = results.poseLandmarks;
            const lWrist = lm[15], rWrist = lm[16], lShoulder = lm[11], rShoulder = lm[12], nose = lm[0];

            // AI TÍNH TOÁN DỰA TRÊN TỶ LỆ CHIỀU RỘNG VAI (KHÔNG BỊ PHỤ THUỘC KHOẢNG CÁCH CAMERA)
            const shoulderWidth = Math.abs(lShoulder.x - rShoulder.x) || 0.1;
            const midShoulderX = (lShoulder.x + rShoulder.x) / 2;
            const wristDist = Math.abs(lWrist.x - rWrist.x);

            // Logic 1: Dừng (Tay ngang vai và đưa ra ngoài)
            const isStop = Math.abs(lWrist.y - lShoulder.y) < 0.2 && Math.abs(rWrist.y - rShoulder.y) < 0.2 && wristDist > shoulderWidth * 1.2;
            
            // Logic 2: Đi xe (Hai tay chạm nhau trên đầu)
            const isGo = lWrist.y < nose.y && rWrist.y < nose.y && wristDist < (shoulderWidth * 0.7);
            
            // Logic 3: Đi chậm (Hai tay giơ thẳng song song)
            const isSlow = lWrist.y < lShoulder.y && rWrist.y < rShoulder.y && wristDist >= (shoulderWidth * 0.8) && !isGo;

            // Logic 4: Nghiêng người (Độ lệch mũi so với trục giữa vai)
            const tilt = (nose.x - midShoulderX) / shoulderWidth;

            let action = "IDLE";
            if (isStop) {
                action = "STOP"; gameSpeed = 0;
            } else if (isSlow) {
                action = "SLOW DOWN"; gameSpeed = 0.05;
            } else if (isGo) {
                action = "DRIVE"; gameSpeed = 0.15;
                if (tilt > 0.3) { currentLane = -1; action += " LEFT"; } 
                else if (tilt < -0.3) { currentLane = 1; action += " RIGHT"; } 
                else { currentLane = 0; }
            } else {
                gameSpeed = 0;
            }

            if (isRedLight && gameSpeed > 0.02) score -= 2;

            document.getElementById('action-text').innerText = action;
            targetX = currentLane * 4;
        }

        const pose = new Pose({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}` });
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        pose.onResults(onResults);
        const cameraUtils = new Camera(videoElement, { onFrame: async () => { await pose.send({ image: videoElement }); }, width: 320, height: 240 });
        cameraUtils.start();

        // --- 4. RENDER VÀ VA CHẠM ---
        function animate() {
            requestAnimationFrame(animate);
            if(!gameRunning) return;

            kartGroup.position.x += (targetX - kartGroup.position.x) * 0.1;
            kartGroup.rotation.z = -(targetX - kartGroup.position.x) * 0.05; // Hiệu ứng nghiêng xe khi rẽ

            obstacles.forEach(item => {
                item.position.z += gameSpeed;
                if(item.userData.type === 'coin') item.rotation.z += 0.05;

                const dist = kartGroup.position.distanceTo(item.position);
                if (dist < 1.8 && !item.userData.collected) {
                    item.userData.collected = true;
                    if (item.userData.type === 'coin') { score += 10; scene.remove(item); }
                    else if (item.userData.type === 'obstacle') { score -= 5; scene.remove(item); }
                    else if (item.userData.type === 'slow') { score += (gameSpeed <= 0.06) ? 15 : -2; }
                }
                if (item.position.z > 5) { item.position.z = -400; item.userData.collected = false; scene.add(item); }
            });

            document.getElementById('score').innerText = score;
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
