<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Smart Circuit City</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06121d;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{position:fixed;inset:0}
.card{background:linear-gradient(180deg,rgba(11,28,48,.9),rgba(6,18,33,.84));border:1px solid rgba(255,255,255,.16);box-shadow:0 10px 35px rgba(0,0,0,.34);backdrop-filter:blur(10px);border-radius:16px}
#hud{position:fixed;left:18px;top:16px;z-index:20;display:flex;gap:10px}
.metric{padding:10px 14px;min-width:92px;text-align:center}
.metric .v{font-size:26px;font-weight:900}
.metric .l{font-size:11px;opacity:.72;margin-top:5px;letter-spacing:.8px}
#timer{font-size:30px}
#cameraWrap{position:fixed;right:18px;top:18px;width:260px;height:195px;z-index:25;border-radius:18px;overflow:hidden;background:#07111d;border:2px solid rgba(255,255,255,.18);box-shadow:0 15px 40px rgba(0,0,0,.42)}
#video,#poseCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#poseCanvas{pointer-events:none}
#status{position:fixed;right:18px;top:225px;width:232px;z-index:25;padding:11px 14px;text-align:center}
#status strong{display:block;font-size:18px;margin-top:4px}
#leanTrack{height:7px;background:rgba(255,255,255,.12);border-radius:999px;margin-top:8px;overflow:hidden;position:relative}
#leanDot{position:absolute;top:0;left:50%;width:14px;height:7px;background:#69efc4;border-radius:999px;transform:translateX(-50%)}
#mission{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);z-index:25;min-width:min(700px,82vw);padding:13px 18px;text-align:center;font-weight:900;font-size:17px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:40;padding:11px 20px;border-radius:999px;background:rgba(5,17,31,.9);border:1px solid rgba(255,255,255,.16);font-weight:900;opacity:0;transition:.18s}
#toast.show{opacity:1}
#timebar{position:fixed;left:18px;right:300px;bottom:18px;height:7px;background:rgba(255,255,255,.15);z-index:20;border-radius:999px;overflow:hidden}
#timefill{height:100%;width:100%;background:linear-gradient(90deg,#3ee1b4,#5da8ff)}
#start,#finish{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:
radial-gradient(circle at 24% 20%,rgba(55,174,255,.25),transparent 34%),
radial-gradient(circle at 78% 72%,rgba(54,233,174,.18),transparent 30%),
linear-gradient(145deg,#06111f,#0a2038 55%,#071521)}
#finish{display:none}
.panel{width:min(820px,92vw);padding:42px;border-radius:28px;background:rgba(7,22,39,.82);border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.5);text-align:center}
h1{margin:0;font-size:54px;letter-spacing:1.2px}
.tagline{margin-top:10px;opacity:.78;font-size:18px}
button{margin-top:30px;border:0;border-radius:16px;padding:15px 30px;font-size:20px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,#39deb2,#6ee6cf);color:#042319;box-shadow:0 10px 30px rgba(57,222,178,.28)}
#finalScore{font-size:78px;font-weight:900;margin:10px 0 0}
.results{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:24px 0}
.chip{min-width:130px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.07)}
.chip b{display:block;font-size:26px}
.good{color:#7ff2bd}.bad{color:#ff9292}.gold{color:#ffe27a}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="card metric"><div id="score" class="v">0</div><div class="l">SCORE</div></div>
  <div class="card metric"><div id="speed" class="v">0</div><div class="l">SPEED</div></div>
  <div class="card metric"><div id="timer" class="v">90</div><div class="l">SECONDS</div></div>
</div>

<div id="cameraWrap">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="poseCanvas"></canvas>
</div>

<div id="status" class="card">
  BODY CONTROL
  <strong id="gestureText">WAITING</strong>
  <div id="leanTrack"><div id="leanDot"></div></div>
</div>

<div id="mission" class="card">Drive through Smart Circuit City</div>
<div id="toast"></div>
<div id="timebar"><div id="timefill"></div></div>

<div id="start">
  <div class="panel">
    <h1>SMART CIRCUIT CITY</h1>
    <div class="tagline">Motion Driving Challenge</div>
    <button id="startBtn">START</button>
  </div>
</div>

<div id="finish">
  <div class="panel">
    <div class="tagline">FINAL RESULT</div>
    <div id="finalScore">0</div>
    <div style="font-size:18px;font-weight:900">POINTS</div>
    <div class="results">
      <div class="chip"><b id="giftCount">0</b>Rewards</div>
      <div class="chip"><b id="avoidCount">0</b>Obstacles Avoided</div>
      <div class="chip"><b id="lightCount">0</b>Red Lights Stopped</div>
      <div class="chip"><b id="hitCount">0</b>Mistakes</div>
    </div>
    <button onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const ui={
 score:document.getElementById('score'),
 speed:document.getElementById('speed'),
 timer:document.getElementById('timer'),
 gesture:document.getElementById('gestureText'),
 leanDot:document.getElementById('leanDot'),
 mission:document.getElementById('mission'),
 toast:document.getElementById('toast'),
 timefill:document.getElementById('timefill'),
 start:document.getElementById('start'),
 finish:document.getElementById('finish'),
 finalScore:document.getElementById('finalScore'),
 giftCount:document.getElementById('giftCount'),
 avoidCount:document.getElementById('avoidCount'),
 lightCount:document.getElementById('lightCount'),
 hitCount:document.getElementById('hitCount')
};

let scene,camera,renderer,car,clock;
let worldZ=0,speed=0,targetSpeed=0,steer=0,gestureSteer=0;
let running=false,timeLeft=90;
let score=0,gifts=0,avoids=0,lights=0,hits=0;
let entities=[],spawnCursor=-42,patternIndex=0;
let keys={},gestureState='STOP';
let leanFiltered=0;

const lanes=[-4.4,0,4.4];
const patterns=[
 {kind:'road',obs:[0],gift:2},
 {kind:'road',obs:[2],gift:0},
 {kind:'slow'},
 {kind:'road',obs:[1],gift:2},
 {kind:'traffic'},
 {kind:'road',obs:[0,2],gift:1},
 {kind:'road',obs:[1],gift:0},
 {kind:'slow'},
 {kind:'traffic'},
 {kind:'road',obs:[0,1],gift:2}
];

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x8ed3ff);
 scene.fog=new THREE.Fog(0xa9d9f4,58,220);

 camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,600);
 camera.position.set(0,8.2,15);

 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.18;
 document.getElementById('game').appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xeaf8ff,0x497349,2.1));
 const sun=new THREE.DirectionalLight(0xffffff,2.5);
 sun.position.set(30,45,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

 const ground=new THREE.Mesh(new THREE.PlaneGeometry(320,520),new THREE.MeshStandardMaterial({color:0x6aa15e,roughness:1}));
 ground.rotation.x=-Math.PI/2;ground.position.z=-180;ground.receiveShadow=true;scene.add(ground);

 const road=new THREE.Mesh(new THREE.PlaneGeometry(15,520),new THREE.MeshStandardMaterial({color:0x20262e,roughness:.95}));
 road.rotation.x=-Math.PI/2;road.position.set(0,.02,-180);road.receiveShadow=true;scene.add(road);

 const sidewalkMat=new THREE.MeshStandardMaterial({color:0xc7d0d7,roughness:.9});
 [-8.2,8.2].forEach(x=>{
  const sw=new THREE.Mesh(new THREE.BoxGeometry(1.7,.22,520),sidewalkMat);
  sw.position.set(x,.1,-180);sw.receiveShadow=true;scene.add(sw);
 });

 for(let z=-450;z<80;z+=8){
  [-2.3,2.3].forEach(x=>{
   const mark=new THREE.Mesh(new THREE.PlaneGeometry(.18,4),new THREE.MeshBasicMaterial({color:0xf7f2d8}));
   mark.rotation.x=-Math.PI/2;mark.position.set(x,.045,z);scene.add(mark);
  });
 }

 createCity();
 createCar();

 for(let i=0;i<8;i++){spawnPattern(spawnCursor);spawnCursor-=44}
 clock=new THREE.Clock();
 addEventListener('resize',resize);
}

function createCity(){
 const colors=[0xd9edf7,0xf0d6ba,0xc9e7d6,0xd5c8ef,0xcbdbe8,0xf1cfd2,0xc8e4ef,0xe6e2c6];
 for(let side of [-1,1]){
  for(let i=0;i<34;i++){
   const w=5+Math.random()*6,h=7+Math.random()*25,d=6+Math.random()*9;
   const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:colors[i%colors.length],roughness:.62,metalness:.08}));
   b.position.set(side*(12+Math.random()*16),h/2,-i*14-8-Math.random()*8);
   b.castShadow=true;b.receiveShadow=true;scene.add(b);

   const roof=new THREE.Mesh(new THREE.BoxGeometry(w*.62,.22,d*.62),new THREE.MeshStandardMaterial({color:0x536a7a,metalness:.3,roughness:.45}));
   roof.position.set(b.position.x,h+.14,b.position.z);scene.add(roof);

   if(i%3===0){
    const neon=new THREE.Mesh(new THREE.BoxGeometry(.25,2.6,4),new THREE.MeshBasicMaterial({color:i%2===0?0x43e8d0:0x67a9ff}));
    neon.position.set(b.position.x-side*(w/2+.14),Math.min(h-2,6.3),b.position.z);
    scene.add(neon);
   }
  }
 }

 for(let i=0;i<45;i++){
  const z=-i*10;
  [-8.9,8.9].forEach(x=>{
   const pole=new THREE.Mesh(new THREE.CylinderGeometry(.07,.1,4,10),new THREE.MeshStandardMaterial({color:0x31414d,metalness:.7}));
   pole.position.set(x,2,z);scene.add(pole);
   const lamp=new THREE.Mesh(new THREE.SphereGeometry(.2,12,8),new THREE.MeshBasicMaterial({color:0xffe9a0}));
   lamp.position.set(x,3.95,z);scene.add(lamp);
   if(i%2===0){
    const tree=new THREE.Group();
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18,.23,1.5,8),new THREE.MeshStandardMaterial({color:0x805836}));
    const crown=new THREE.Mesh(new THREE.SphereGeometry(1.05,14,10),new THREE.MeshStandardMaterial({color:0x31845a}));
    trunk.position.y=.75;crown.position.y=2;tree.add(trunk,crown);tree.position.set(x+(x<0?-2.1:2.1),0,z-3.5);scene.add(tree);
   }
  });
 }

 // parks
 for(let k=0;k<8;k++){
  const z=-45-k*55;
  const park=new THREE.Mesh(new THREE.BoxGeometry(8,.15,12),new THREE.MeshStandardMaterial({color:0x4e995b,roughness:1}));
  park.position.set(k%2===0?-16:16,.08,z);scene.add(park);
 }

 // sky bridge style structures
 for(let k=0;k<4;k++){
  const z=-90-k*100;
  const beam=new THREE.Mesh(new THREE.BoxGeometry(26,.45,1.2),new THREE.MeshStandardMaterial({color:0x647887,metalness:.45,roughness:.35}));
  beam.position.set(0,7,z);scene.add(beam);
 }
}

function createCar(){
 car=new THREE.Group();
 const mat=new THREE.MeshStandardMaterial({color:0x0fb7cc,metalness:.52,roughness:.25});
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.3,.7,4.25),mat);body.position.y=.75;body.castShadow=true;car.add(body);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(2.1,.38,1.1),mat);hood.position.set(0,1.03,-1.48);car.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.72,.78,1.95),new THREE.MeshStandardMaterial({color:0xc3ecff,metalness:.15,roughness:.12,transparent:true,opacity:.93}));
 cabin.position.set(0,1.38,.18);car.add(cabin);
 const wheelMat=new THREE.MeshStandardMaterial({color:0x101214,roughness:1});
 for(const sx of [-1,1])for(const sz of [-1.36,1.36]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.34,18),wheelMat);
  w.rotation.z=Math.PI/2;w.position.set(sx*1.08,.48,sz);car.add(w);
 }
 car.position.set(0,0,8);scene.add(car);
}

function barrier(lane,z){
 const g=new THREE.Group();
 const base=new THREE.Mesh(new THREE.BoxGeometry(2.5,.95,.88),new THREE.MeshStandardMaterial({color:0xffa534,roughness:.55}));
 base.position.y=.52;g.add(base);
 for(let i=-1;i<=1;i++){
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(.34,.98,.9),new THREE.MeshStandardMaterial({color:0x222a31}));
  stripe.position.set(i*.72,.52,0);stripe.rotation.z=.42;g.add(stripe);
 }
 const beacon=new THREE.Mesh(new THREE.SphereGeometry(.15,10,8),new THREE.MeshBasicMaterial({color:0xff4e4e}));
 beacon.position.set(0,1.25,0);g.add(beacon);
 g.position.set(lanes[lane],0,z);scene.add(g);
 entities.push({mesh:g,type:'obstacle',active:true,checked:false});
}

function gift(lane,z){
 const g=new THREE.Group();
 const box=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.05,1.05),new THREE.MeshStandardMaterial({color:0xffd94d,metalness:.22,roughness:.25}));
 box.position.y=.8;g.add(box);
 const band1=new THREE.Mesh(new THREE.BoxGeometry(.2,1.1,1.1),new THREE.MeshStandardMaterial({color:0xff5e67}));band1.position.y=.8;g.add(band1);
 const band2=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.1,.2),new THREE.MeshStandardMaterial({color:0xff5e67}));band2.position.y=.8;g.add(band2);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.92,.06,10,30),new THREE.MeshBasicMaterial({color:0xffef9a}));
 ring.rotation.x=Math.PI/2;ring.position.y=.8;g.add(ring);
 g.position.set(lanes[lane],0,z);scene.add(g);
 entities.push({mesh:g,type:'gift',active:true,checked:false,spin:Math.random()*6});
}

function slowZone(z){
 for(let i=0;i<7;i++){
  const strip=new THREE.Mesh(new THREE.PlaneGeometry(14,.3),new THREE.MeshBasicMaterial({color:0xffd75e}));
  strip.rotation.x=-Math.PI/2;strip.position.set(0,.055,z-i*.7);scene.add(strip);
 }
 entities.push({mesh:{position:{z:z-2.2}},type:'slow',active:true,checked:false});
}

function trafficLight(z){
 const group=new THREE.Group();
 const line=new THREE.Mesh(new THREE.PlaneGeometry(14,1),new THREE.MeshBasicMaterial({color:0xffffff}));
 line.rotation.x=-Math.PI/2;line.position.set(0,.06,0);group.add(line);
 for(let i=-3;i<=3;i++){
  const stripe=new THREE.Mesh(new THREE.PlaneGeometry(1.1,2.8),new THREE.MeshBasicMaterial({color:0xeef5f8}));
  stripe.rotation.x=-Math.PI/2;stripe.position.set(i*1.8,.055,-3);group.add(stripe);
 }
 for(const side of [-1,1]){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.12,.14,5,12),new THREE.MeshStandardMaterial({color:0x24313b,metalness:.65}));
  pole.position.set(side*6.3,2.5,-.5);group.add(pole);
  const housing=new THREE.Mesh(new THREE.BoxGeometry(.9,2.55,.75),new THREE.MeshStandardMaterial({color:0x111820,metalness:.45}));
  housing.position.set(side*6.3,4.6,-.5);group.add(housing);
  const red=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10),new THREE.MeshBasicMaterial({color:0xff3b30}));
  red.position.set(side*6.3,5.35,-.88);group.add(red);
  const yellow=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10),new THREE.MeshBasicMaterial({color:0x554d1d}));
  yellow.position.set(side*6.3,4.62,-.88);group.add(yellow);
  const green=new THREE.Mesh(new THREE.SphereGeometry(.25,16,10),new THREE.MeshBasicMaterial({color:0x164b32}));
  green.position.set(side*6.3,3.9,-.88);group.add(green);
  if(side===1)group.userData={red,yellow,green};
 }
 group.position.set(0,0,z);scene.add(group);
 entities.push({mesh:group,type:'traffic',active:true,checked:false,state:'red',hold:0});
}

function setTrafficColor(t,state){
 t.state=state;
 const ud=t.mesh.userData;
 if(!ud.red)return;
 ud.red.material.color.set(state==='red'?0xff3b30:0x4a1717);
 ud.yellow.material.color.set(state==='yellow'?0xffd447:0x554d1d);
 ud.green.material.color.set(state==='green'?0x35e477:0x164b32);
}

function spawnPattern(z){
 const p=patterns[patternIndex++%patterns.length];
 if(p.kind==='traffic'){trafficLight(z);return}
 if(p.kind==='slow'){slowZone(z);return}
 p.obs.forEach(l=>barrier(l,z));
 gift(p.gift,z-9);
}

function toast(text,cls=''){
 ui.toast.className='show '+cls;ui.toast.textContent=text;
 clearTimeout(toast.t);toast.t=setTimeout(()=>ui.toast.className='',900);
}

function update(dt){
 if(keys.ArrowUp)gestureState='RUN';
 if(keys.ArrowDown)gestureState='SLOW';
 if(keys.Space)gestureState='STOP';

 if(['RUN','LEFT','RIGHT'].includes(gestureState))targetSpeed=18;
 else if(gestureState==='SLOW')targetSpeed=7;
 else targetSpeed=0;

 if(keys.ArrowLeft)steer=-1;
 else if(keys.ArrowRight)steer=1;
 else steer+=(gestureSteer-steer)*Math.min(1,dt*14);

 speed+=(targetSpeed-speed)*Math.min(1,dt*3.2);
 car.position.x+=steer*dt*9.2;
 car.position.x=Math.max(-4.8,Math.min(4.8,car.position.x));
 car.rotation.z+=((-steer*.2)-car.rotation.z)*Math.min(1,dt*11);

 worldZ+=speed*dt;
 scene.position.z=worldZ;
 camera.position.x+=(car.position.x*.44-camera.position.x)*Math.min(1,dt*5);
 camera.lookAt(car.position.x*.1,1,-8);

 ui.speed.textContent=Math.round(speed*6);
 ui.score.textContent=Math.max(0,Math.round(score));

 let nearSpecial=false;

 for(const e of entities){
  if(!e.active)continue;
  const wz=e.mesh.position.z+worldZ;

  if(e.type==='gift'){
   e.mesh.rotation.y+=dt*2.8;
   e.mesh.position.y=.12+Math.sin(performance.now()/250+e.spin)*.16;
  }

  if(e.type==='traffic'){
   if(wz>-10&&wz<24){
    nearSpecial=true;
    if(e.state==='red'){
     ui.mission.textContent='RED LIGHT — STOP';
     if(wz>2.5&&wz<8.5&&speed<1.2){
      e.hold+=dt;
      if(e.hold>=1.0){
       setTrafficColor(e,'green');
       score+=60;lights++;
       toast('GOOD STOP +60','good');
       ui.mission.textContent='GREEN LIGHT — GO';
      }
     }else if(speed>1.2&&wz<8.5){e.hold=Math.max(0,e.hold-dt*.5)}
     if(wz>9.2&&!e.checked){
      score=Math.max(0,score-80);hits++;e.checked=true;setTrafficColor(e,'green');
      toast('RED LIGHT -80','bad');
     }
    }else{
     ui.mission.textContent='GREEN LIGHT — GO';
     if(wz>14&&!e.checked)e.checked=true;
    }
   }
   continue;
  }

  if(e.type==='slow'){
   if(wz>-4&&wz<18){
    nearSpecial=true;
    ui.mission.textContent='SLOW ZONE';
    if(wz>7&&!e.checked){
     if(speed<10){score+=30;toast('GOOD SPEED +30','good')}
     else{score=Math.max(0,score-20);hits++;toast('TOO FAST -20','bad')}
     e.checked=true;
    }
   }
   continue;
  }

  if(wz>4.4&&wz<11.7){
   const dx=Math.abs(car.position.x-e.mesh.position.x);
   if(e.type==='obstacle'&&!e.checked){
    if(dx<1.65){
     score=Math.max(0,score-35);hits++;e.active=false;e.mesh.visible=false;toast('COLLISION -35','bad');
    }else if(wz>9.9){
     score+=20;avoids++;e.checked=true;toast('AVOIDED +20','good');
    }
   }
   if(e.type==='gift'&&dx<1.55){
    score+=35;gifts++;e.active=false;e.mesh.visible=false;toast('REWARD +35','gold');
   }
  }
 }

 if(!nearSpecial)ui.mission.textContent='Drive through Smart Circuit City';

 if(spawnCursor+worldZ>-190){
  spawnPattern(spawnCursor);
  spawnCursor-=44;
 }
}

function loop(){
 requestAnimationFrame(loop);
 const dt=Math.min(clock?clock.getDelta():.016,.05);
 if(running){
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame()}
  update(dt);
  ui.timer.textContent=Math.ceil(timeLeft);
  ui.timefill.style.width=(timeLeft/90*100)+'%';
 }
 renderer.render(scene,camera);
}

function endGame(){
 running=false;targetSpeed=0;speed=0;
 ui.finalScore.textContent=Math.max(0,Math.round(score));
 ui.giftCount.textContent=gifts;
 ui.avoidCount.textContent=avoids;
 ui.lightCount.textContent=lights;
 ui.hitCount.textContent=hits;
 ui.finish.style.display='flex';
}

function resize(){
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(e.code==='ArrowLeft'){gestureState='LEFT';gestureSteer=-1}
 if(e.code==='ArrowRight'){gestureState='RIGHT';gestureSteer=1}
 if(e.code==='ArrowUp'){gestureState='RUN';gestureSteer=0}
 if(e.code==='ArrowDown'){gestureState='SLOW';gestureSteer=0}
 if(e.code==='Space'){gestureState='STOP';gestureSteer=0}
});
addEventListener('keyup',e=>keys[e.code]=false);

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function detectGesture(lm){
 if(!lm)return;
 const nose=lm[0],ls=lm[11],rs=lm[12],lw=lm[15],rw=lm[16],lh=lm[23],rh=lm[24];
 const shoulderW=Math.max(.08,dist(ls,rs));
 const handsTouch=dist(lw,rw)<shoulderW*.78;
 const aboveHead=lw.y<nose.y+.055&&rw.y<nose.y+.055;
 const armsUp=lw.y<ls.y-.12&&rw.y<rs.y-.12;
 const armsSide=Math.abs(lw.y-ls.y)<.14&&Math.abs(rw.y-rs.y)<.14&&Math.abs(lw.x-ls.x)>.14&&Math.abs(rw.x-rs.x)>.14;

 const hipX=(lh.x+rh.x)/2;
 const shoulderX=(ls.x+rs.x)/2;
 const headX=nose.x;

 // Stronger body-bend signal:
 // head deviation is weighted heavily, shoulders moderately.
 const raw=((headX-hipX)*0.72 + (shoulderX-hipX)*0.28)/shoulderW;
 leanFiltered=leanFiltered*.42+raw*.58;

 if(armsSide){
  gestureState='STOP';gestureSteer=0;ui.gesture.textContent='STOP';ui.leanDot.style.left='50%';return;
 }
 if(armsUp&&!handsTouch){
  gestureState='SLOW';gestureSteer=0;ui.gesture.textContent='SLOW';ui.leanDot.style.left='50%';return;
 }

 if(aboveHead&&handsTouch){
  // extremely small dead zone
  const dz=.004;
  let s=0;
  if(Math.abs(leanFiltered)>dz){
   s=Math.sign(leanFiltered)*Math.min(1,(Math.abs(leanFiltered)-dz)/.075);
  }

  // mirror camera feel
  s=-s;
  gestureSteer=s;
  ui.leanDot.style.left=(50+s*46)+'%';

  if(s<-.06){gestureState='LEFT';ui.gesture.textContent='LEFT';return}
  if(s>.06){gestureState='RIGHT';ui.gesture.textContent='RIGHT';return}
  gestureState='RUN';ui.gesture.textContent='GO';return;
 }
}

async function startPose(){
 const video=document.getElementById('video');
 const canvas=document.getElementById('poseCanvas');
 const ctx=canvas.getContext('2d');

 try{
  const pose=new Pose({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
  pose.setOptions({
   modelComplexity:1,
   smoothLandmarks:true,
   enableSegmentation:false,
   minDetectionConfidence:.45,
   minTrackingConfidence:.45
  });

  pose.onResults(res=>{
   canvas.width=video.videoWidth||640;
   canvas.height=video.videoHeight||480;
   ctx.clearRect(0,0,canvas.width,canvas.height);

   if(res.poseLandmarks){
    detectGesture(res.poseLandmarks);
    const p=res.poseLandmarks;
    const pairs=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
    ctx.strokeStyle='#4ff4c2';ctx.fillStyle='#fff';ctx.lineWidth=4;
    for(const [a,b] of pairs){
     ctx.beginPath();
     ctx.moveTo(p[a].x*canvas.width,p[a].y*canvas.height);
     ctx.lineTo(p[b].x*canvas.width,p[b].y*canvas.height);
     ctx.stroke();
    }
    for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){
     ctx.beginPath();
     ctx.arc(p[i].x*canvas.width,p[i].y*canvas.height,5,0,Math.PI*2);
     ctx.fill();
    }
   }
  });

  const cam=new Camera(video,{
   onFrame:async()=>pose.send({image:video}),
   width:640,height:480
  });

  await cam.start();
  toast('CAMERA READY','good');
 }catch(err){
  console.warn(err);
  toast('CAMERA NOT AVAILABLE','bad');
 }
}

document.getElementById('startBtn').onclick=async()=>{
 ui.start.style.display='none';
 running=true;
 timeLeft=90;
 score=0;gifts=0;avoids=0;lights=0;hits=0;
 clock.start();
 await startPose();
};

init3D();
loop();
